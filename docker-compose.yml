services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # SQLite lives here (the image's working directory). A named volume is writable by
      # the image's non-root user on any host; the old ./:/app bind mount was not.
      - triage-data:/data

volumes:
  triage-data:
